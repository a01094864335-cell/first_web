<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소원방 광장 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e5da;color:#282722;font:15px system-ui,sans-serif}
main{max-width:480px;margin:auto;background:#faf7ed;min-height:100svh;display:flex;flex-direction:column}
header{padding:16px 18px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
small{font-weight:700;color:#656057}h1{font-size:clamp(19px,5.4vw,25px);margin:3px 0 0;letter-spacing:-.06em}
.count{font-size:12px;white-space:nowrap;background:#eee8d9;border-radius:24px;padding:7px 10px;font-weight:700}
.room-state{display:flex;align-items:center;gap:6px}
.leave{font-size:12px;padding:6px 8px;white-space:nowrap}
.world{position:relative;background:#e5e7d4;border-block:2px solid #282722;flex:1;min-height:390px;overflow:hidden}
canvas{width:100%;height:100%;position:absolute;inset:0}
.rank{position:absolute;top:12px;left:12px;background:#faf7ed;border:1px solid;border-radius:10px;padding:6px 10px;font-size:11px;font-weight:700;display:flex;gap:8px;flex-wrap:wrap;margin-right:12px}
.rank span:first-of-type{color:#a34d3a}
.chat{display:flex;gap:8px;padding:0 12px 12px}
.chat input{flex:1;min-width:0;border:1.5px solid #625b50;border-radius:12px;background:#fffdf7;padding:9px 12px;font:inherit;font-size:16px;color:inherit}
.chat button{padding:8px 13px;background:#efd1b4;white-space:nowrap}
.world.in-room canvas{cursor:crosshair;touch-action:manipulation}
.move-tip{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:11px;color:#565942;pointer-events:none}
.speech-layer{position:absolute;inset:0;pointer-events:none}
.speech{position:absolute;transform:translate(-50%,-100%);width:max-content;max-width:128px;padding:5px 8px;border:1.5px solid #463b31;border-radius:10px;background:#fffdf5;color:#282722;font-size:12px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;box-shadow:0 2px #28272223}
.speech.mine{background:#fff0df}
.speech::after{content:'';position:absolute;left:calc(50% - 4px);bottom:-5px;width:7px;height:7px;background:inherit;border-right:1.5px solid #463b31;border-bottom:1.5px solid #463b31;transform:rotate(45deg)}
.rank{z-index:1}
.controls{padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gate{padding:12px}
.gate button{width:100%;background:#efd1b4;min-height:62px;font-size:17px;box-shadow:0 2px #282722}
.notice{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#292820;color:#fffaf0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none}
[hidden]{display:none!important}
button{touch-action:manipulation;border:1.5px solid #282722;background:#fffaf0;color:inherit;border-radius:12px;padding:9px 0;font:inherit;font-weight:800;cursor:pointer}
button span{display:block;font-size:18px}button[aria-pressed=true]{background:#efd1b4;box-shadow:0 2px #282722}
@media(min-width:540px){main{margin:15px auto;min-height:min(830px,calc(100svh - 30px));border:1px solid #bbb4a3;border-radius:17px;overflow:hidden}}
</style>
<main>
<header><div><small>✦ 소원방</small><h1>이번 주 로또 1등</h1></div><div class="room-state"><span class="count">9명 · 데모</span><button class="leave" hidden>나가기 ↗</button></div></header>
<section class="world" aria-label="옷 색이 다른 둥근 캐릭터들이 같은 광장에서 소원 액션을 하는 모습">
<canvas tabindex="-1" aria-label="광장. 바닥을 누르거나 방향키로 이동"></canvas><div class="move-tip" hidden>바닥을 눌러 이동</div><div class="speech-layer" role="log" aria-label="방 채팅 말풍선" aria-live="polite"></div><div class="rank" id="ranking"></div><div class="notice" role="status" hidden></div>
</section>
<div class="gate"><button class="enter">소원방 입장 ↓</button></div>
<div class="controls" aria-label="내 캐릭터 액션" hidden>
<button data-action="pray" aria-pressed="false"><span aria-hidden="true">🙏</span>기도</button>
<button data-action="bow" aria-pressed="false"><span aria-hidden="true">🙇</span>절</button>
<button data-action="thumb" aria-pressed="false"><span aria-hidden="true">👍</span>따봉</button>
<button data-action="dab" aria-pressed="false"><span aria-hidden="true">↗</span>댑</button>
</div>
<form class="chat" hidden autocomplete="off">
<input aria-label="방 채팅 메시지" placeholder="한마디 남기기" maxlength="48" enterkeyhint="send" required>
<button type="submit">보내기</button>
</form>
</main>
<script>
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const ink = '#292820';
const labels = {pray:'기도', bow:'절', thumb:'따봉', dab:'댑'};
const scores = {pray:31, bow:9, thumb:18, dab:42};
const players = [
  [.23,.24,'#e99185','pray'],[.51,.24,'#f2c95e','thumb'],[.79,.28,'#ab9ae4','dab'],
  [.26,.43,'#a9cde0','bow'],[.61,.42,'#e99185','dab'],[.83,.49,'#f2c95e','dab'],
  [.21,.65,'#ab9ae4','pray'],[.69,.62,'#a9cde0','dab'],[.42,.83,'#a4c180','idle'],
  [.79,.81,'#e99185','dab']
];
const mine = players[8];
const spawn=mine.slice(0,2);
const destinations=new Map();
const moveTip=document.querySelector('.move-tip');
const bounds=(x,y)=>[Math.max(.10,Math.min(.90,x)),Math.max(.22,Math.min(.88,y))];

function moveTo(x,y){
  if(presence!=='inside') return;
  destinations.set(mine,bounds(x,y));
  announce('move');
}
canvas.addEventListener('click',event=>{
  if(presence!=='inside') return;
  const rect=canvas.getBoundingClientRect();
  moveTo((event.clientX-rect.left)/rect.width,(event.clientY-rect.top)/rect.height);
  canvas.focus({preventScroll:true});
});
canvas.addEventListener('keydown',event=>{
  const offset={ArrowLeft:[-.075,0],ArrowRight:[.075,0],ArrowUp:[0,-.075],ArrowDown:[0,.075]}[event.key];
  if(presence!=='inside'||!offset) return;
  event.preventDefault();
  const [x,y]=destinations.get(mine)??mine;
  moveTo(x+offset[0],y+offset[1]);
});
let lastFrame=0;
function movePlayers(ms){
  const elapsed=Math.max(0,Math.min(40,ms-lastFrame));
  lastFrame=ms;
  for(const [player,[x,y]] of destinations){
    const dx=x-player[0],dy=y-player[1];
    const distance=Math.hypot(dx,dy);
    const progress=reducedMotion.matches||distance===0?1:Math.min(1,elapsed*.00065/distance);
    player[0]+=dx*progress;
    player[1]+=dy*progress;
    if(progress===1) destinations.delete(player);
  }
}
const taps = [];
let poseStart = performance.now();
let presence = 'outside';
let transitionStart = 0;
let noticeTimer;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const gate = document.querySelector('.gate');
const enter = document.querySelector('.enter');
const leave = document.querySelector('.leave');
const controls = document.querySelector('.controls');
const count = document.querySelector('.count');
const notice = document.querySelector('.notice');

function showNotice(message){
  clearTimeout(noticeTimer);
  notice.textContent=message;
  notice.hidden=false;
  noticeTimer=setTimeout(()=>{notice.hidden=true;},1400);
}

function finishTransition(entering,ms){
  presence=entering?'inside':'outside';
  if(entering) poseStart=ms;
  gate.hidden=entering;
  controls.hidden=!entering;
  chat.hidden=!entering;
  moveTip.hidden=!entering;
  canvas.tabIndex=entering?0:-1;
  canvas.parentElement.classList.toggle('in-room',entering);
  announce(entering?'hello':'leave');
  if(!entering){peers.clear();destinations.clear();}
  updateCount();
  leave.hidden=!entering;
  enter.disabled=false;
  leave.disabled=false;
  buttons.forEach(button=>{button.disabled=false;});
  (entering?leave:enter).focus({preventScroll:true});
  showNotice(entering?'● 접속 완료':'○ 접속 종료');
}

function startTransition(entering){
  if(presence!==(entering?'outside':'inside')) return;
  presence=entering?'entering':'leaving';
  transitionStart=performance.now();
  notice.hidden=true;
  clearTimeout(noticeTimer);
  enter.disabled=true;
  leave.disabled=true;
  buttons.forEach(button=>{button.disabled=true;});
  if(entering){
    [mine[0],mine[1]]=spawn;
    mine[3]='idle';
    buttons.forEach(button=>button.setAttribute('aria-pressed','false'));
  }else{
    taps.length=0;
    clearTimeout(replyTimer);
    chatInput.value='';
    for(const player of [...bubbles.keys()]) removeBubble(player);
  }
  if(reducedMotion.matches) finishTransition(entering,transitionStart);
}

function drawArrival(x,y,s,t,ms){
  const entering=presence==='entering';
  const p=Math.max(0,Math.min(1,(ms-transitionStart)/680));
  const ripple=entering?Math.max(0,(p-.39)/.61):p;
  const lift=entering?78*Math.max(0,1-p/.46)**2:4*Math.sin(p*Math.PI);
  const size=entering
    ? 1-.18*Math.max(0,1-Math.abs(p-.49)/.13)+.08*Math.max(0,1-Math.abs(p-.67)/.14)
    : (1-p)**1.7;
  ctx.save();
  ctx.globalAlpha=(1-ripple)*.85;
  ctx.beginPath();
  ctx.ellipse(x,y+18*s,(23+ripple*40)*s,(7+ripple*13)*s,0,0,Math.PI*2);
  ctx.lineWidth=3;
  ctx.strokeStyle='#b85d47';
  ctx.stroke();
  for(let i=0;i<6;i++){
    const angle=i*Math.PI/3;
    oval(x+Math.cos(angle)*(24+ripple*41)*s,y+17*s+Math.sin(angle)*(10+ripple*18)*s,2,2,'#b85d47',false);
  }
  ctx.globalAlpha=1;
  if(size>.08) character(x,y-lift*s,s*size,mine,t);
  if(!entering&&p>.55) oval(x,y+18*s,4*(1-p),4*(1-p),'#b85d47',false);
  ctx.restore();
  if(p===1) finishTransition(entering,ms);
}

function oval(x,y,rx,ry,fill,outline=true){
  ctx.beginPath();
  ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle=fill;
  ctx.fill();
  if(outline){ctx.strokeStyle=ink;ctx.lineWidth=2.2;ctx.stroke();}
}
const clips = {
  pray:{intro:[[1,160]],loop:[[2,570],[3,570]]},

  dab:{intro:[],loop:[[15,2400],[16,160],[17,170],[18,2400],[19,160],[20,170]]}
};

function tintedAtlas(shirt){
  if(tintedAtlases.has(shirt)) return tintedAtlases.get(shirt);
  const spriteCanvas=document.createElement('canvas');
  spriteCanvas.width=atlas.naturalWidth;
  spriteCanvas.height=atlas.naturalHeight;
  const spriteContext=spriteCanvas.getContext('2d');
  spriteContext.drawImage(atlas,0,0);
  const pixels=spriteContext.getImageData(0,0,spriteCanvas.width,spriteCanvas.height);
  const rgb=[1,3,5].map(i=>parseInt(shirt.slice(i,i+2),16));
  for(let i=0;i<pixels.data.length;i+=4){
    const r=pixels.data[i], g=pixels.data[i+1], b=pixels.data[i+2];
    if(pixels.data[i+3] && r>105 && b>g+12 && r>g+6 && b>=r){
      const light=(r+g+b)/3-185;
      rgb.forEach((value,channel)=>{pixels.data[i+channel]=value+light;});
    }
  }
  spriteContext.putImageData(pixels,0,0);
  tintedAtlases.set(shirt,spriteCanvas);
  return spriteCanvas;
}
function frameAt(sequence,age){
  for(const [frame,duration] of sequence){
    if(age<duration) return frame;
    age-=duration;
  }
}
function spriteFrame(action,age){
  const clip=clips[action];
  if(!clip) return 0;
  if(reducedMotion.matches) return action==='bow'?7:clip.loop[0][0];
  const introLength=clip.intro.reduce((sum,[,ms])=>sum+ms,0);
  if(age<introLength) return frameAt(clip.intro,age);
  const loopLength=clip.loop.reduce((sum,[,ms])=>sum+ms,0);
  return frameAt(clip.loop,(age-introLength)%loopLength);
}
function character(x,y,s,player,t){
  const [,,shirt,action]=player;
  const age=player===mine?Math.max(0,t*1000-poseStart):t*1000+x*11;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);
  oval(0,20,24,5,player===mine?'#d19476':'#c5c8ae',false);
  if(atlas.complete && atlas.naturalWidth){
    const frame=spriteFrame(action,age);
    ctx.drawImage(tintedAtlas(shirt),frame%5*150,Math.floor(frame/5)*150,150,150,-36,-47,72,72);
  }
  if(player===mine){
    ctx.font='bold 12px system-ui';
    ctx.fillStyle=ink;
    ctx.textAlign='center';
    ctx.fillText('나',0,36);
  }
  ctx.restore();
}

let nextDemoTap=0;
let demoPlayer=0;
const demoEffects=new Map();
const visitors=players.filter(player=>player!==mine);
function simulateTap(ms){
  if(ms<nextDemoTap) return;
  nextDemoTap=ms+680;
  const group=demoPlayer%3===0?visitors.filter(player=>player[3]==='dab'):[visitors[demoPlayer%visitors.length]];
  demoPlayer++;
  for(const player of group){
    scores[player[3]]++;
    demoEffects.set(player,ms);
  }
  rank();
}
function draw(ms){
  const t=ms/1000;
  simulateTap(ms);
  if(presence==='inside') movePlayers(ms);
  const {width:w,height:h}=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#cbd0b8';
  ctx.lineWidth=1;
  for(let y=48;y<h;y+=32){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(w,y);
    ctx.stroke();
  }
  const s=Math.min(w/390,h/490,1.14);
  for(const player of [...players,...peers.values()]){
    const [x,y]=player;
    if(player===mine && presence!=='inside'){
      if(presence!=='outside') drawArrival(x*w,y*h,s,t,ms);
      continue;
    }
    character(x*w,y*h,s,player,t);
    const effect=(ms-(demoEffects.get(player)??-Infinity))/680;
    if(effect<1&&!reducedMotion.matches){
      ctx.globalAlpha=1-effect;
      ctx.fillStyle='#a34d3a';
      ctx.font='bold 14px system-ui';
      ctx.fillText(player[3]==='dab'?'+1 ↗':'+1',Math.min(x*w+20,w-38),y*h-29-effect*19);
      ctx.globalAlpha=1;
    }
  }
  while(taps.length && ms-taps[0].at>850) taps.shift();
  for(const tap of taps){
    const age=(ms-tap.at)/850;
    ctx.globalAlpha=1-age;
    ctx.fillStyle='#a34d3a';
    ctx.font='bold 16px system-ui';
    ctx.fillText('+1',mine[0]*w+26+tap.offset,mine[1]*h-30-age*28);
  }
  ctx.globalAlpha=1;
  for(const [player,bubble] of bubbles){
    if(ms>=bubble.expires) removeBubble(player);
    else{
      bubble.node.style.left='clamp(66px,'+player[0]*100+'%,calc(100% - 66px))';
      bubble.node.style.top=Math.max(79,player[1]*h-41*s)+'px';
    }
  }
  requestAnimationFrame(draw);
}
function rank(){
  const board=document.querySelector('#ranking');
  board.replaceChildren('우리 방 랭킹');
  Object.keys(scores).sort((a,b)=>scores[b]-scores[a]).forEach(action=>{
    const row=document.createElement('span');
    row.textContent=labels[action]+' '+scores[action];
    board.append(row);
  });
}
const buttons=[...document.querySelectorAll('[data-action]')];
const chat=document.querySelector('.chat');
const chatInput=chat.querySelector('input');
const speechLayer=document.querySelector('.speech-layer');
const bubbles=new Map();
const peers=new Map();
const clientId=globalThis.crypto?.randomUUID?.() ?? String(Math.random()).slice(2);
const seats=[[.39,.58],[.56,.68],[.44,.40],[.55,.81],[.33,.73],[.64,.29]];
const channel=typeof BroadcastChannel==='function'?new BroadcastChannel('wish-room-lotto-chat-v1'):null;
let replyTimer;

function updateCount(){
  count.textContent=(presence==='inside'?'● ':'')+(players.length-1+peers.size+Number(presence==='inside'))+'명 · 데모';
}
function removeBubble(player){
  bubbles.get(player)?.node.remove();
  bubbles.delete(player);
}
function speak(player,message){
  removeBubble(player);
  const node=document.createElement('div');
  node.className='speech'+(player===mine?' mine':'');
  node.textContent=message;
  node.style.left='clamp(66px,'+player[0]*100+'%,calc(100% - 66px))';
  const {width,height}=canvas.getBoundingClientRect();
  node.style.top=Math.max(79,player[1]*height-41*Math.min(width/390,height/490,1.14))+'px';
  speechLayer.append(node);
  bubbles.set(player,{node,expires:performance.now()+4200});
}
function announce(type,message){
  channel?.postMessage({type,id:clientId,action:mine[3],position:destinations.get(mine)??mine.slice(0,2),message});
}
if(channel){
  channel.onmessage=({data})=>{
    if(presence!=='inside'||!data||typeof data.id!=='string'||data.id===clientId) return;
    if(data.type==='leave'){
      const departed=peers.get(data.id);
      removeBubble(departed);
      destinations.delete(departed);
      peers.delete(data.id);
      updateCount();
      return;
    }
    if(!['hello','state','chat','action','move'].includes(data.type)) return;
    let player=peers.get(data.id);
    if(!player){
      const seat=seats.find(([x,y])=>![...peers.values()].some(p=>p[0]===x&&p[1]===y))??seats[0];
      player=[...seat,'#80bcb2','idle'];
      peers.set(data.id,player);
      updateCount();
    }
    if(data.type==='hello') announce('state');
    if(Array.isArray(data.position)&&data.position.length===2&&data.position.every(Number.isFinite)) destinations.set(player,bounds(...data.position));
    if(data.action==='idle'||Object.hasOwn(labels,data.action)) player[3]=data.action;
    if(data.type==='chat'&&typeof data.message==='string') speak(player,data.message.trim().slice(0,48));
  };
  window.addEventListener('pagehide',()=>{if(presence==='inside') announce('leave');});
}
chat.addEventListener('submit',event=>{
  event.preventDefault();
  const message=chatInput.value.trim();
  if(presence!=='inside'||!message) return;
  speak(mine,message);
  announce('chat',message);
  chatInput.value='';
  clearTimeout(replyTimer);
  if(!peers.size){
    replyTimer=setTimeout(()=>{
      if(presence==='inside'&&!peers.size) speak(visitors[3],'같이 빌어줄게! · 데모');
    },950);
  }
});
enter.addEventListener('click',()=>startTransition(true));
leave.addEventListener('click',()=>startTransition(false));
buttons.forEach(button=>button.addEventListener('click',()=>{
  if(presence!=='inside') return;
  const action=button.dataset.action;
  if(mine[3]!==action){
    const now=performance.now();
    mine[3]=action;
    poseStart=now;
    announce('action');
    buttons.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
  }
  scores[action]++;
  taps.push({at:performance.now(),offset:(taps.length%4)*6});
  rank();
}));
rank();
requestAnimationFrame(draw);
</script>
</html>
